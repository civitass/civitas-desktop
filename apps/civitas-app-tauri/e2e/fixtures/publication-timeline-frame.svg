<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-safe Northstar launch workspace</title>
  <desc id="desc">A deterministic synthetic project workspace used to verify and demonstrate the real Civitas Timeline without personal data.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f242b"/>
      <stop offset="1" stop-color="#171b20"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#92b5ff"/>
      <stop offset="1" stop-color="#9ee0c0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f5f6f7; font-size: 42px; font-weight: 650; letter-spacing: -1.4px; }
      .heading { fill: #f1f3f5; font-size: 20px; font-weight: 620; letter-spacing: -.25px; }
      .body { fill: #d6d9dd; font-size: 16px; font-weight: 500; }
      .muted { fill: #9198a2; font-size: 14px; font-weight: 500; }
      .tiny { fill: #7f8791; font-size: 12px; font-weight: 600; letter-spacing: .65px; }
      .chip { fill: #cbd0d6; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#canvas)"/>

  <!-- Native-style window chrome -->
  <rect width="1440" height="64" fill="#252a31"/>
  <circle cx="28" cy="32" r="7" fill="#6b7077"/>
  <circle cx="52" cy="32" r="7" fill="#6b7077"/>
  <circle cx="76" cy="32" r="7" fill="#6b7077"/>
  <text class="ui body" x="112" y="38">Northstar</text>
  <rect x="1218" y="18" width="188" height="30" rx="10" fill="#30363e"/>
  <circle cx="1240" cy="33" r="6" fill="#9ee0c0"/>
  <text class="ui muted" x="1254" y="38">Private workspace</text>

  <!-- Project rail -->
  <rect y="64" width="248" height="836" fill="#1b2026"/>
  <text class="ui tiny" x="28" y="112">WORKSPACE</text>
  <rect x="16" y="132" width="216" height="44" rx="12" fill="#2d333b"/>
  <circle cx="38" cy="154" r="6" fill="#92b5ff"/>
  <text class="ui body" x="56" y="160">Launch room</text>
  <text class="ui muted" x="28" y="216">Roadmap</text>
  <text class="ui muted" x="28" y="258">Decisions</text>
  <text class="ui muted" x="28" y="300">Research</text>
  <text class="ui muted" x="28" y="342">Release notes</text>
  <line x1="20" y1="382" x2="228" y2="382" stroke="#313740"/>
  <text class="ui tiny" x="28" y="420">THIS WEEK</text>
  <text class="ui body" x="28" y="456">Release candidate</text>
  <text class="ui muted" x="28" y="484">8 of 10 checks complete</text>
  <rect x="28" y="506" width="184" height="6" rx="3" fill="#323841"/>
  <rect x="28" y="506" width="147" height="6" rx="3" fill="url(#progress)"/>
  <rect x="20" y="796" width="208" height="72" rx="14" fill="#232830" stroke="#343b44"/>
  <circle cx="48" cy="832" r="15" fill="#39424c"/>
  <text class="ui body" x="76" y="828">Focus session</text>
  <text class="ui muted" x="76" y="850">42 min · no blockers</text>

  <!-- Main header -->
  <text class="ui tiny" x="292" y="112">LAUNCH ROOM  /  FRIDAY</text>
  <text class="ui title" x="292" y="166">Launch readiness</text>
  <text class="ui muted" x="292" y="198">A calm view of what is ready, what is next, and what still needs a decision.</text>
  <rect x="1136" y="126" width="110" height="38" rx="12" fill="#2b3139" stroke="#3b424c"/>
  <text class="ui chip" x="1162" y="151">Share view</text>
  <rect x="1258" y="126" width="142" height="38" rx="12" fill="#f1f3f5"/>
  <text class="ui" x="1280" y="151" fill="#16191d" font-size="13" font-weight="650">New decision</text>

  <!-- Readiness summary -->
  <rect x="292" y="232" width="1108" height="112" rx="18" fill="#252b32" stroke="#353c45" filter="url(#shadow)"/>
  <text class="ui tiny" x="320" y="270">OVERALL READINESS</text>
  <text class="ui" x="320" y="319" fill="#f5f6f7" font-size="38" font-weight="650">82%</text>
  <rect x="424" y="286" width="620" height="10" rx="5" fill="#343b44"/>
  <rect x="424" y="286" width="508" height="10" rx="5" fill="url(#progress)"/>
  <text class="ui muted" x="424" y="320">Two checks and one owner decision remain before release.</text>
  <rect x="1130" y="260" width="112" height="54" rx="14" fill="#2f353d"/>
  <text class="ui tiny" x="1150" y="282">COMPLETE</text>
  <text class="ui heading" x="1150" y="306">8</text>
  <rect x="1254" y="260" width="118" height="54" rx="14" fill="#2f353d"/>
  <text class="ui tiny" x="1274" y="282">REMAINING</text>
  <text class="ui heading" x="1274" y="306">3</text>

  <!-- Kanban columns -->
  <text class="ui tiny" x="292" y="392">NOW · 2</text>
  <text class="ui tiny" x="666" y="392">NEXT · 2</text>
  <text class="ui tiny" x="1040" y="392">DECISIONS · 2</text>

  <g filter="url(#shadow)">
    <rect x="292" y="412" width="336" height="154" rx="16" fill="#272d34" stroke="#3b424b"/>
    <rect x="316" y="436" width="72" height="26" rx="9" fill="#33475d"/>
    <text class="ui chip" x="336" y="454" fill="#bdd5ff">VERIFY</text>
    <text class="ui heading" x="316" y="500">Windows installer</text>
    <text class="ui muted" x="316" y="528">Install, upgrade, and local data migration</text>
    <circle cx="322" cy="548" r="5" fill="#9ee0c0"/>
    <text class="ui tiny" x="334" y="553">OWNER · MAYA</text>

    <rect x="292" y="584" width="336" height="154" rx="16" fill="#272d34" stroke="#3b424b"/>
    <rect x="316" y="608" width="58" height="26" rx="9" fill="#3a3d55"/>
    <text class="ui chip" x="332" y="626" fill="#d7d4ff">QA</text>
    <text class="ui heading" x="316" y="672">Multilingual OCR</text>
    <text class="ui muted" x="316" y="700">Chinese, Japanese, and mixed-language screens</text>
    <circle cx="322" cy="720" r="5" fill="#92b5ff"/>
    <text class="ui tiny" x="334" y="725">12 / 15 CASES</text>

    <rect x="666" y="412" width="336" height="154" rx="16" fill="#272d34" stroke="#3b424b"/>
    <rect x="690" y="436" width="72" height="26" rx="9" fill="#3d443a"/>
    <text class="ui chip" x="707" y="454" fill="#cce8bd">WRITE</text>
    <text class="ui heading" x="690" y="500">Publish release notes</text>
    <text class="ui muted" x="690" y="528">Lead with Timeline and evidence-linked actions</text>
    <circle cx="696" cy="548" r="5" fill="#9ee0c0"/>
    <text class="ui tiny" x="708" y="553">DRAFT READY</text>

    <rect x="666" y="584" width="336" height="154" rx="16" fill="#272d34" stroke="#3b424b"/>
    <rect x="690" y="608" width="82" height="26" rx="9" fill="#4a4030"/>
    <text class="ui chip" x="707" y="626" fill="#f0d7a4">CAPTURE</text>
    <text class="ui heading" x="690" y="672">Record product tour</text>
    <text class="ui muted" x="690" y="700">Use synthetic content; keep the real interface</text>
    <circle cx="696" cy="720" r="5" fill="#e6c77e"/>
    <text class="ui tiny" x="708" y="725">20 MIN · TOMORROW</text>

    <rect x="1040" y="412" width="360" height="154" rx="16" fill="#272d34" stroke="#3b424b"/>
    <rect x="1064" y="436" width="82" height="26" rx="9" fill="#33475d"/>
    <text class="ui chip" x="1081" y="454" fill="#bdd5ff">DECIDED</text>
    <text class="ui heading" x="1064" y="500">Local-first by default</text>
    <text class="ui muted" x="1064" y="528">Remote AI only after an explicit boundary choice</text>
    <circle cx="1070" cy="548" r="5" fill="#9ee0c0"/>
    <text class="ui tiny" x="1082" y="553">EVIDENCE LINKED</text>

    <rect x="1040" y="584" width="360" height="154" rx="16" fill="#272d34" stroke="#3b424b"/>
    <rect x="1064" y="608" width="82" height="26" rx="9" fill="#33475d"/>
    <text class="ui chip" x="1081" y="626" fill="#bdd5ff">DECIDED</text>
    <text class="ui heading" x="1064" y="672">Predictions stay drafts</text>
    <text class="ui muted" x="1064" y="700">Nothing sends or executes without a choice</text>
    <circle cx="1070" cy="720" r="5" fill="#9ee0c0"/>
    <text class="ui tiny" x="1082" y="725">REVIEWED TODAY</text>
  </g>

  <!-- Footer activity strip -->
  <line x1="292" y1="786" x2="1400" y2="786" stroke="#303740"/>
  <text class="ui tiny" x="292" y="824">RECENT ACTIVITY</text>
  <circle cx="444" cy="819" r="5" fill="#92b5ff"/>
  <text class="ui muted" x="458" y="824">Maya verified the macOS notarization path</text>
  <circle cx="786" cy="819" r="5" fill="#9ee0c0"/>
  <text class="ui muted" x="800" y="824">Alex linked 3 release decisions</text>
  <text class="ui tiny" x="1294" y="824">UPDATED NOW</text>
</svg>
