          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The caller is not authorized to inspect configured ICS calendars.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The bounded local API concurrency limit is occupied.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Local calendar settings could not be read.
      summary: Get ICS calendar status
      tags:
      - Connections
  /connections/whatsapp/pair:
