  /auth/mcp/credentials:
    get:
      operationId: mcp_credentials_list
      summary: List MCP client credentials
      description: Lists bounded metadata for owner-issued MCP client credentials. Secret bearer values are never returned.
      tags:
      - MCP Credentials
      parameters:
      - in: query
        name: includeRevoked
        required: false
        schema:
          type: boolean
          default: false
        description: Include revoked credential metadata in the inventory.
      responses:
        '200':
          description: Credential metadata ordered by newest issuance first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCredentialListResponse'
        '400':
          description: includeRevoked could not be deserialized as a boolean.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The device-owner credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The operating-system credential vault is unavailable or could not persist the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
      x-civitas-required-principal: owner
    post:
      operationId: mcp_credentials_issue
      summary: Issue an MCP client credential
      description: Revokes any active credential with the same client name, then returns one new scoped bearer exactly once.
        Only a digest-derived lookup key and encrypted metadata remain in the OS credential vault.
      tags:
      - MCP Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpIssueCredentialRequest'
      responses:
        '201':
          description: Credential issued; store the returned token now because it cannot be listed later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpIssuedCredentialResponse'
        '400':
          description: The request name, scopes, or expiry is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
            text/plain:
              schema:
                type: string
        '403':
          description: The device-owner credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Content-Type is not application/json.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The JSON request has unknown fields or does not match the credential issue object.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The operating-system credential vault is unavailable or could not persist the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
      x-civitas-required-principal: owner
  /auth/mcp/credentials/revoke-client:
    post:
      operationId: mcp_credentials_revoke_client
      summary: Revoke every credential for one MCP client
      description: Revokes every currently active credential whose normalized client name exactly matches the request.
      tags:
      - MCP Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpRevokeClientRequest'
      responses:
        '200':
          description: Number of credentials newly revoked; zero is a valid idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRevokeClientResponse'
        '400':
          description: The client name is invalid, or the credential vault could not complete the bulk revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
            text/plain:
              schema:
                type: string
        '403':
          description: The device-owner credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Content-Type is not application/json.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The JSON request has unknown fields or does not contain a string name.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-civitas-required-principal: owner
  /auth/mcp/credentials/{id}:
    delete:
      operationId: mcp_credentials_revoke
      summary: Revoke one MCP client credential
      description: Revokes the identified credential. Repeating the operation for the same known credential is idempotent.
      tags:
      - MCP Credentials
      parameters:
      - in: path
        name: id
        required: true
        style: simple
        schema:
          type: string
      responses:
        '204':
          description: Credential revoked, or it was already revoked.
        '403':
          description: The device-owner credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          description: The credential was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
        '503':
          description: The operating-system credential vault is unavailable or could not persist the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-civitas-required-principal: owner
  /auth/mcp/credentials/{id}/rotate:
    post:
      operationId: mcp_credentials_rotate
      summary: Rotate one MCP client credential
      description: Atomically revokes an active credential and returns a replacement with the same client name and scopes
        and a new 90-day expiry. The new bearer is returned exactly once.
      tags:
      - MCP Credentials
      parameters:
      - in: path
        name: id
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: Replacement credential and one-time bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpIssuedCredentialResponse'
        '403':
          description: The device-owner credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          description: The credential was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
        '409':
          description: The credential is inactive, or the credential vault could not atomically revoke and replace it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpErrorResponse'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-civitas-required-principal: owner
