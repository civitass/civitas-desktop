    post:
      operationId: connections_obsidian_note_append
      summary: Append a local Obsidian note
      description: Appends Markdown under a configured local Obsidian vault. The route rejects absolute paths, traversal,
        hidden components, symlink parents or targets, non-Markdown files, and oversized writes. A dedupe key creates a one-way
        marker and makes retries idempotent.
      tags:
      - Connections
      parameters:
      - in: query
        name: instance
        required: false
        description: Optional named Obsidian vault; omitted selects the default.
        schema:
          type: string
        style: form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalNoteWriteRequest'
      responses:
        '200':
          description: Append result; duplicate=true and written=false means the dedupe marker already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalNoteWriteResponse'
        '400':
          description: Query parsing, vault lookup, path safety, size, file inspection, or append failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/plain:
              schema:
                type: string
        '403':
          description: The caller lacks the exact Obsidian note-write permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: No default or selected Obsidian vault is connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
