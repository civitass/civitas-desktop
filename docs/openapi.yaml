          description: No browser is registered with the decoded ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /connections/browsers/{id}/navigate:
    post:
      operationId: connections_browser_navigate
      summary: Request one approved browser navigation
      description: Validates one credential-free HTTPS URL, waits up to 60 seconds for a fresh desktop Allow once decision,
        then asks the selected connected extension to navigate its active tab. No click, form-fill, submit, cookie, hidden-tab,
        or arbitrary-JavaScript operation exists.
      tags:
      - Connections
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserNavigateRequest'
      responses:
        '200':
          description: The owner approved the exact URL and the extension completed the navigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserNavigateSuccessResponse'
        '400':
          description: The URL is invalid, non-HTTPS, credential-bearing, over 2,048 characters, or contains control characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
            text/plain:
              schema:
                type: string
        '403':
          description: Authentication failed or the desktop owner denied this one navigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '404':
          description: No browser is registered with the decoded ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '408':
          description: The owner did not decide within the 60-second approval window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Content-Type is not application/json.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The JSON request is structurally invalid, or the extension rejected the fixed navigation command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
            text/plain:
              schema:
                type: string
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: The extension transport disconnected or could not accept the command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '503':
          description: The selected browser extension is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '504':
          description: The connected extension did not answer within ten seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
  /connections/browsers/{id}/snapshot:
    get:
      operationId: connections_browser_snapshot
      summary: Read the active browser-tab outline
      description: Requests the extension's fixed, bounded accessibility-style outline for the tab on which the user invoked
        the extension. Password and hidden inputs, form values, URL credentials, query strings, and fragments are omitted
        by the reviewed extension implementation.
      tags:
      - Connections
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          description: Bounded public page outline from the active tab.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserPageSnapshot'
        '403':
          description: The caller is not authorized for this browser snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No browser is registered with the decoded ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The extension rejected the fixed snapshot command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: The extension transport disconnected or could not accept the command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '503':
          description: The selected browser extension is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
        '504':
          description: The connected extension did not answer within 15 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCommandFailureResponse'
  /connections/browser/action/pending:
    get:
      operationId: connections_browser_action_pending
      summary: Get pending browser action
      description: Returns the oldest unexpired navigation approval for the owner-facing desktop dialog. This route requires
        the device-owner credential.
