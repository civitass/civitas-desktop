  /connections/browser/action/approve:
    post:
      operationId: connections_browser_action_approve
      summary: Approve or deny a browser action
      description: Resolves exactly one pending navigation decision. Decisions are one-shot and an expired or already resolved
        ID returns 404. This route requires the device-owner credential.
      tags:
      - Connections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserActionApproveRequest'
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: The JSON body is malformed.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The device-owner credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Action request not found, expired, or already resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Content-Type is not application/json.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The JSON value does not contain a string id and boolean approved value.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-civitas-required-principal: owner
  /connections/browser/ws:
    get:
      operationId: connections_browser_websocket
      summary: Open the browser-extension transport
      description: Authenticated WebSocket handshake for the reviewed fixed-command browser protocol. Use the owner bearer
        or an unexpired, Origin-bound sp_browser credential with browser:bridge scope. Browser extensions pass the credential
        as a civitas-auth.<base64url-token> WebSocket subprotocol so it never enters the URL.
      tags:
      - Connections
      parameters:
      - in: header
        name: Origin
        required: false
        description: Required when using an Origin-bound sp_browser credential; owner authentication does not require it.
        schema:
          type: string
      - in: header
        name: Sec-WebSocket-Protocol
        required: false
        description: Alternative browser-extension authentication transport containing civitas-auth.<base64url-token>.
        schema:
          type: string
      responses:
        '101':
          description: WebSocket protocol switched; subsequent frames use the fixed hello, ping/pong, snapshot, and navigate
            command protocol.
        '400':
          description: Required WebSocket upgrade headers are absent or invalid.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Owner or Origin-bound browser authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-civitas-protocol: websocket
  /connections/browser/credentials:
    get:
      description: Lists revocable browser-extension credential metadata. Secret token values are never returned.
      operationId: connections_browser_credentials_list
