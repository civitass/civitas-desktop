              schema:
                $ref: '#/components/schemas/ApiError'
            text/plain:
              schema:
                type: string
        '403':
          description: The caller is not authorized to start WhatsApp pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Content-Type is not application/json.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The request is missing string bun_path, contains an unknown field, or is otherwise structurally invalid.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The trusted runtime, dependency setup, or local gateway process could not start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
