          description: The bounded local API concurrency limit is occupied.
      summary: Get pending browser pairing
      tags:
      - Connections
      x-civitas-required-principal: owner
  /connections/browser/pair/start:
    post:
      description: Starts a two-minute pairing request. This is an owner-bearer exemption, but it accepts only a loopback
        client carrying an exact chrome-extension, moz-extension, or extension Origin. The engine keeps at most 16 pairing
        records. The reported extension_id is informational; identity is derived from Origin.
      operationId: connections_browser_pair_start
      parameters:
      - description: Exact browser-extension Origin.
        in: header
        name: Origin
        required: true
        schema:
          maxLength: 256
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserPairStartRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserPairStartResponse'
          description: Pairing challenge created.
        '400':
          content:
            text/plain:
              schema:
                type: string
          description: The JSON body is malformed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Client is not loopback or Origin is not an accepted extension Origin.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Pairing retains sixteen records, or local API concurrency is occupied.
        '413':
          content:
            text/plain:
              schema:
                type: string
          description: The JSON body exceeds the local API's 2 MiB default limit.
        '415':
          content:
            text/plain:
              schema:
                type: string
          description: Content-Type is not application/json.
        '422':
          content:
            text/plain:
              schema:
                type: string
          description: The JSON value does not match the optional pairing metadata object.
      security: []
      summary: Start browser pairing
      tags:
      - Connections
  /connections/browser/pair/status:
    get:
      description: Polls one pairing request using the exact Origin and one-time challenge returned by start. A newly approved
        sp_browser token is returned once, then the pairing record is removed. Missing, mismatched, replayed, or expired values
        return status=expired without revealing whether the ID existed.
      operationId: connections_browser_pair_status
      parameters:
      - in: query
        name: id
        required: true
        schema:
          type: string
        style: form
      - description: Exact browser-extension Origin used to start the pair.
        in: header
        name: Origin
        required: true
        schema:
          maxLength: 256
          type: string
      - description: 64-character one-time challenge returned by pair/start.
        in: header
        name: X-Civitas-Pairing-Challenge
        required: true
        schema:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserPairStatusResponse'
          description: Current pairing state.
        '400':
          content:
            text/plain:
              schema:
                type: string
          description: The required id query parameter is missing or cannot be deserialized.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Client is not loopback or Origin is not an accepted extension Origin.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The bounded local API concurrency limit is occupied.
      security: []
      summary: Poll browser pairing
      tags:
      - Connections
  /connections/browser/status:
    get:
      description: Returns bridge connection state. Accepts either the owner local API bearer or an unexpired sp_browser credential
        bound to the exact request Origin and browser:status scope.
      operationId: connections_browser_status
      responses:
        '200':
          content:
            application/json:
              schema:
