          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /connections/ics-calendar/events:
