  /connections:
    get:
      operationId: connections_list
      summary: List consumer connections
      description: Lists the compiled consumer integrations plus local calendar, ICS, WhatsApp, and explicitly paired browser
        status. Secret values, vault paths, and ICS feed URLs are never returned.
      tags:
      - Connections
      responses:
        '200':
          description: Connection definitions and current local status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'
        '403':
          description: The bearer or browser Origin is not authorized for this owner-facing inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /connections/{id}:
    parameters:
    - in: path
      name: id
      required: true
      description: Compiled consumer integration ID. GET also accepts an explicitly registered browser ID.
      schema:
        type: string
      style: simple
    get:
      operationId: connections_get
      summary: Get connection status
      description: Returns connection state and only non-secret configuration. Stored secret fields and local path fields
        are represented by field names or SHA-256 fingerprints, never their values.
      tags:
      - Connections
      responses:
        '200':
          description: Integration configuration or registered-browser status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetailResponse'
        '400':
          description: The ID is not a compiled integration or registered browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller is not authorized for this connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: connections_save
      summary: Save connection credentials
      description: Merges provided fields with any existing encrypted credential record and enables the default connection.
        Unknown fields and an empty resulting credential set are rejected.
      tags:
      - Connections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCredentialsRequest'
      responses:
        '200':
          description: Credentials were encrypted and saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Unknown integration, unknown credential field, empty credential set, or persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/plain:
              schema:
                type: string
        '403':
          description: The caller is not authorized to change this connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: The JSON body exceeds the local API's 2 MiB default limit.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Content-Type is not application/json.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The JSON value does not match the required request object.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: connections_disconnect
      summary: Disconnect an integration
      description: Removes the default encrypted credential record. Claude Code and Codex memory bridges first remove only
        Civitas-owned local content; a cleanup failure leaves the connection intact.
      tags:
      - Connections
      responses:
        '200':
          description: Connection removed. local_cleanup is present only for supported local memory bridges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDisconnectResponse'
        '400':
          description: Local bridge cleanup, credential lookup, or credential removal failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The caller is not authorized to disconnect this integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /connections/{id}/config:
    get:
      operationId: connections_config_get
      summary: Get non-secret connection configuration
      description: Returns only fields declared non-secret by the compiled integration. Personal filesystem paths are vault-only
        and excluded. The first non-empty instance query value selects a named credential record.
      tags:
