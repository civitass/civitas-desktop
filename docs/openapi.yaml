        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - name
      - scopes
      - issuedAt
      - expiresAt
      - lastUsedAt
      - revokedAt
    McpCredentialListResponse:
      type: object
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/McpCredentialSummary'
      required:
      - credentials
    McpIssueCredentialRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9 ._-]+$
        scopes:
          type: array
          default:
          - read
          minItems: 1
          description: Values are trimmed, normalized to lowercase, deduplicated, and then checked against the five supported
            scopes.
          x-normalized-enum:
          - read
          - inspect
          - manage
          - capture
          - media
          items:
            type: string
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      required:
      - name
      additionalProperties: false
    McpIssuedCredentialResponse:
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/McpCredentialSummary'
        token:
          type: string
          pattern: ^sp_mcp_[A-Za-z0-9]{64}$
          description: One-time bearer value. It is never returned by inventory endpoints.
      required:
      - credential
      - token
    McpRevokeClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9 ._-]+$
      required:
      - name
      additionalProperties: false
    McpRevokeClientResponse:
      type: object
      properties:
        revoked:
          type: integer
          minimum: 0
      required:
      - revoked
    McpErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    McpErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/McpErrorDetail'
      required:
      - error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Local owner key or a route-authorized scoped workflow, browser, MCP, or knowledge-graph credential
      description: 'Pass `Authorization: Bearer <token>`. The consumer API requires the owner local key by default. Individual
        routes may additionally accept a narrower `sp_pipe`, `sp_browser`, `sp_mcp`, or knowledge-graph grant. Query-string
        credentials are rejected.'
info:
  title: Civitas API
  version: 1.0.0
  description: 'Civitas is a local-first personal work memory. After the owner grants OS permissions and starts capture, this
    API can search local screen text and transcripts, inspect provenance-aware knowledge, and manage the owner''s local data.


    The server binds to loopback at `http://127.0.0.1:3030` by default. Bearer authentication is enabled by default; obtain
    the credential through the desktop app''s authorized local integration flow. Remote AI or connection requests occur only
    after the owner configures and invokes those features.'
openapi: 3.0.3
paths:
  /activity-summary:
    get:
      description: 'Rich activity summary for a time range, with optional agent-context fields.


        By default returns: app usage, window/tab activity, sampled screen text,

        edited files, audio summary, recording health, memories, bounded snippets,

        and a `data_status`/`query_status`/`guidance` triple so agents can tell

        "nothing was recorded" apart from "query didn''t match".


        Pass `include_recording=false`, `include_memories=false`,

        `include_snippets=false`, or `include_guidance=false` to slim the payload.'
      operationId: routes_activity_summary_get_activity_summary
      parameters:
      - in: query
        name: start_time
        schema:
          format: date-time
          type: string
        style: form
      - in: query
        name: end_time
        schema:
          format: date-time
          type: string
        style: form
      - in: query
        name: app_name
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: q
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: include_recording
        schema:
          type: boolean
        style: form
      - in: query
        name: include_memories
        schema:
          type: boolean
        style: form
      - in: query
        name: include_snippets
        schema:
          type: boolean
        style: form
      - in: query
        name: include_guidance
        schema:
          type: boolean
        style: form
      - in: query
        name: max_snippets
        schema:
          type: integer
        style: form
      - in: query
        name: max_snippet_chars
        schema:
          type: integer
        style: form
      - in: query
        name: max_memories
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySummaryResponse'
          description: OK
      tags:
      - Activity
      summary: Get activity summary
  /add:
    post:
      operationId: routes_content_add_to_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddContentResponse'
          description: OK
      tags:
      - Database
      summary: Add content to database
      description: Manually insert screen or audio content into the database.
  /audio/device/start:
    post:
      operationId: routes_audio_start_audio_device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioDeviceControlRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDeviceControlResponse'
          description: OK
      tags:
      - Audio
      summary: Start recording a specific audio device
  /audio/device/status:
    get:
      operationId: routes_audio_audio_device_status
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeviceStatusEntry'
                type: array
          description: OK
      tags:
      - Audio
      summary: Audio device status
  /audio/device/stop:
    post:
      operationId: routes_audio_stop_audio_device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioDeviceControlRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDeviceControlResponse'
          description: OK
      tags:
      - Audio
      summary: Stop recording a specific audio device
  /audio/list:
    get:
      operationId: routes_audio_api_list_audio_devices
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ListDeviceResponse'
                type: array
          description: OK
      tags:
      - Audio
      summary: List audio devices
      description: Returns all available audio input and output devices.
  /audio/start:
    post:
      operationId: routes_audio_start_audio
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
      tags:
      - Audio
      summary: Start audio recording
  /audio/stop:
    post:
      operationId: routes_audio_stop_audio
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
      tags:
      - Audio
      summary: Stop audio recording
  /data/backup:
    get:
      description: 'Create an atomic SQLite backup via `VACUUM INTO`. Safe to call while

        Civitas is running — the backup is a consistent snapshot.'
      operationId: routes_data_backup_handler
      parameters:
      - in: query
        name: path
        schema:
          nullable: true
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResponse'
          description: OK
      tags:
      - Data Management
      summary: Backup
  /data/checkpoint:
    post:
      description: Flush the WAL into the main database file, making it safe to copy.
      operationId: routes_data_checkpoint_handler
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
          description: OK
      tags:
      - Data Management
      summary: Checkpoint
  /data/delete-range:
    post:
      operationId: routes_data_delete_time_range_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTimeRangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTimeRangeResponse'
          description: OK
      tags:
      - Data Management
      summary: Delete data in time range
      description: Permanently delete all captured data (frames, OCR, audio, etc.) within a time range.
  /data/deletion-preview:
    get:
      description: Exact, owner-only preview for a full local work-data wipe.
      operationId: routes_portable_data_deletion_preview_handler
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionPreviewResponse'
          description: OK
      tags:
      - Data Management
      summary: Routes portable data deletion preview
  /data/evict-media:
    post:
      description: 'POST /data/evict-media — reclaim mp4/wav/jpeg files in a time range

        while keeping DB rows intact. Search and timeline still work; playback

        for that period shows a "media evicted" placeholder.'
      operationId: routes_data_evict_media_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvictMediaRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictMediaResponse'
          description: OK
      tags:
      - Data Management
      summary: Evict media
  /data/full-wipe:
    post:
      description: 'Permanently delete all local captured and derived work data. The desktop

        shell pauses capture before invoking this route and leaves it paused after

        success; the preview token prevents deleting a library that changed after

        confirmation.'
      operationId: routes_portable_data_full_wipe_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullWipeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullWipeResponse'
          description: OK
      tags:
      - Data Management
      summary: Routes portable data full wipe
  /data/graph/assertions/{claim_id}:
    delete:
      description: Delete one graph claim and its direct dependent assertions.
      operationId: routes_portable_data_delete_graph_assertion_handler
      parameters:
      - in: path
        name: claim_id
        schema:
          type: integer
        style: simple
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAssertionResponse'
          description: OK
      tags:
      - Data Management
      summary: Routes portable data delete graph assertion
  /data/inspector:
    get:
      description: 'Bounded "What Civitas knows" summary. It never returns media paths,

        credentials, or an unbounded capture dump.'
      operationId: routes_portable_data_data_inspector_handler
      parameters:
      - in: query
        name: sample_limit
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataInspectorResponse'
          description: OK
      tags:
      - Data Management
      summary: Routes portable data data inspector
  /data/portable-export:
    post:
      description: 'Write a deterministic, checksum-manifested export to an explicit local

        directory. No export bytes leave the device.'
      operationId: routes_portable_data_portable_export_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortableExportRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortableExportResponse'
          description: OK
      tags:
      - Data Management
      summary: Routes portable data portable export
  /data/storage-preview:
    get:
      description: 'GET /data/storage-preview — estimate disk reclaimable by media eviction

        for the given window. Used by the retention confirmation dialog.'
      operationId: routes_data_storage_preview_handler
      parameters:
      - in: query
        name: older_than_days
        schema:
          nullable: true
          type: integer
        style: form
      - in: query
        name: start
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - in: query
        name: end
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePreviewResponse'
          description: OK
      tags:
      - Data Management
      summary: Storage preview
  /elements:
    get:
      description: Search elements across all frames with optional FTS, time, and app filters.
      operationId: routes_elements_search_elements
      parameters:
      - in: query
        name: q
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: frame_id
        schema:
          nullable: true
          type: integer
        style: form
      - in: query
        name: source
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: role
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: start_time
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - in: query
        name: end_time
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - in: query
        name: app_name
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: on_screen
        schema:
          nullable: true
          type: boolean
        style: form
      - in: query
        name: limit
        schema:
          type: integer
        style: form
      - in: query
        name: offset
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementsListResponse'
          description: OK
      tags:
      - Elements
      summary: Search UI elements
  /endpoint/capabilities:
    get:
      operationId: routes_capabilities_endpoint_capabilities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCapabilitiesResponse'
          description: OK
      summary: Routes capabilities endpoint capabilities
  /episodes:
    get:
      description: List episodes in a time range.
      operationId: routes_episodes_list_episodes_handler
      parameters:
      - in: query
        name: start_time
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: end_time
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: limit
        schema:
          type: integer
        style: form
      - in: query
        name: offset
        schema:
          type: integer
        style: form
      - in: query
        name: include_open
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeListResponse'
          description: OK
      summary: Routes episodes list episodes
  /episodes/ground-truth:
    post:
      description: Bulk replace episodes in a review window with user-verified ground-truth.
      operationId: routes_episodes_ground_truth_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroundTruthRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
      summary: Routes episodes ground truth
  /episodes/{id}:
    get:
      description: Get a single episode with its segments and actions.
      operationId: routes_episodes_get_episode_handler
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        style: simple
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDetailResponse'
          description: OK
      summary: Routes episodes get episode
  /episodes/{id}/label:
    post:
      description: Apply user-provided labels to an episode.
      operationId: routes_episodes_label_episode_handler
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        style: simple
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelEpisodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
      summary: Routes episodes label episode
  /export:
    post:
      description: 'Render a recording to a single MP4 (screen frames + synced audio) via the engine

        export core. Pass `meeting_id` (window resolved from the DB) or `start`/`end` for an

        arbitrary range. Long-running: the caller should show a progress indicator. Writes to

        `output_path` if given, else the data dir''s `exports/` folder. This is the HTTP twin of

        the `civitas export` CLI — same `meeting_id` XOR `start`/`end` contract.'
      operationId: routes_meetings_export_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
          description: OK
      summary: Export
  /frames/next-valid:
    get:
      description: 'Find the next frame that has a valid video file on disk.

        This allows the frontend to skip directly to a valid frame instead of

        trying each frame one-by-one when frames fail to load.'
      operationId: routes_frames_get_next_valid_frame
      parameters:
      - in: query
        name: frame_id
        schema:
          type: integer
        style: form
      - in: query
        name: direction
        schema:
          type: string
        style: form
      - in: query
        name: limit
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextValidFrameResponse'
          description: OK
      tags:
      - Frames
      summary: Get next valid frame
  /frames/{frame_id}:
    get:
      operationId: routes_frames_get_frame_data
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      - in: query
        name: redact_pii
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
      tags:
      - Frames
      summary: Get frame by ID
      description: Returns a captured screenshot frame with optional base64 image data.
  /frames/{frame_id}/context:
    get:
      description: 'Get frame context: accessibility text, tree nodes, and extracted URLs.

        Falls back to OCR data for legacy frames without accessibility data.'
      operationId: routes_frames_get_frame_context
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameContextResponse'
          description: OK
      tags:
      - Frames
      summary: Get frame context
  /frames/{frame_id}/elements:
    get:
      description: Get all elements for a specific frame (full element tree).
      operationId: routes_elements_get_frame_elements
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      - in: query
        name: source
        schema:
          nullable: true
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementsListResponse'
          description: OK
      tags:
      - Frames
      summary: Get frame UI elements
  /frames/{frame_id}/metadata:
    get:
      description: Get frame metadata (timestamp) for deep link navigation. civitas://frame/123 → resolve to timestamp.
      operationId: routes_frames_get_frame_metadata
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameMetadataResponse'
          description: OK
      tags:
      - Frames
      summary: Get frame metadata
  /frames/{frame_id}/ocr:
    get:
      description: 'Get OCR text positions with bounding boxes for a specific frame.

        Falls back to accessibility tree node bounds when no OCR data exists.

        Both OCR and accessibility bounds are normalized to 0-1 relative to the

        monitor (full-screen capture), so they align correctly with the screenshot.'
      operationId: routes_frames_get_frame_ocr_legacy
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      - in: query
        name: query
        schema:
          nullable: true
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameTextResponse'
          description: OK
      tags:
      - Frames
      summary: Get frame OCR (deprecated)
    post:
      operationId: routes_frames_run_frame_ocr_legacy
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameTextResponse'
          description: OK
      tags:
      - Frames
      summary: Run frame OCR (deprecated)
      description: Deprecated alias for POST /frames/{frame_id}/text.
  /frames/{frame_id}/text:
    get:
      description: 'Get OCR text positions with bounding boxes for a specific frame.

        Falls back to accessibility tree node bounds when no OCR data exists.

        Both OCR and accessibility bounds are normalized to 0-1 relative to the

        monitor (full-screen capture), so they align correctly with the screenshot.'
      operationId: routes_frames_get_frame_text_data
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      - in: query
        name: query
        schema:
          nullable: true
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameTextResponse'
          description: OK
      tags:
      - Frames
      summary: Get frame text (OCR)
    post:
      operationId: routes_frames_run_frame_ocr
      parameters:
      - in: path
        name: frame_id
        schema:
          type: integer
        style: simple
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameTextResponse'
          description: OK
      tags:
      - Frames
      summary: Run OCR on frame
      description: Triggers OCR processing on a specific frame and returns the extracted text.
  /graph:
    get:
      operationId: routes_graph_graph_overview_handler
      parameters:
      - in: query
        name: limit
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphOverviewResponse'
          description: OK
      summary: Routes graph graph overview
  /graph/next:
    get:
      operationId: routes_graph_next_graph_next_handler
      parameters:
      - in: query
        name: entity
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: limit
        schema:
          nullable: true
          type: integer
        style: form
      - in: query
        name: allow_app_fallback
        schema:
          nullable: true
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNextResponse'
          description: OK
