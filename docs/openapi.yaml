        name: limit
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContradictionsResponse'
          description: OK
      tags:
      - Knowledge Graph
      summary: Find contradictions
  /kg/decisions:
    get:
      description: '`GET /kg/decisions` — what did we decide about entity X and why?


        Traversal (§3.3):

        1. Resolve entity: exact `get_entity_by_key` on slug, else FTS.

        2. List decision claims for that entity (`list_decisions_for_entity`).

        If no entity given, fall back to FTS over all decision claims.

        3. For each decision, walk `kg_edges WHERE relation=''SUPPORTED_BY''`

        from the decision''s claim-id to fetch reason claims.

        4. Apply `since` and `min_confidence` filters.'
      operationId: routes_kg_query_decisions
      parameters:
      - in: query
        name: entity
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: since
        schema:
          nullable: true
          type: string
        style: form
      - in: query
        name: min_confidence
        schema:
          nullable: true
          type: number
        style: form
      - in: query
        name: limit
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
          description: OK
      tags:
      - Knowledge Graph
      summary: Query decisions for an entity
  /kg/decisions/recent:
    get:
      description: '`GET /kg/decisions/recent` — what decisions appeared in recent local work?


        The no-entity "catch me up" path that `query_decisions` deliberately leaves empty.

        Reuses [`enrich_decision_item`] so each item carries the same reasons + options +

        honesty + provenance envelope as `query_decisions`.'
      operationId: routes_kg_list_recent_decisions
      parameters:
      - in: query
