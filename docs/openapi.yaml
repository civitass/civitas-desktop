              schema:
                type: string
        '403':
          description: The caller is not authorized to read the local calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The bounded local API concurrency limit is occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Native calendar access is unavailable or the blocking calendar task failed.
