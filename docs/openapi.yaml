        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The bounded local API concurrency limit is occupied.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Local calendar settings could not be read.
      summary: Read ICS calendar events
      tags:
      - Connections
  /connections/ics-calendar/status:
    get:
      description: Reports local ICS subscription names and enabled state without exposing feed URLs or fetching remote data.
      operationId: connections_ics_calendar_status
      responses:
        '200':
