#
# The motivating case: a PR review is interrupted by a short Slack exchange.
# The Slack ping must become its own small episode; the PR review resumes
# afterward rather than splitting into two separate episodes.
#
# Threading expectation: the second pr_review segment expects_resume = true.
# Resume precision/recall must both be >= 0.6.

[meta]
name = "pr_review_with_slack_interruption"
description = "PR review interrupted by a Slack ping, then resumed — tests threading"
seed = 1002

[[timeline]]
kind = "pr_review"
pr = "acme/api#42"
mins = 12

[[timeline]]
kind = "slack"
mins = 4

[[timeline]]
kind = "pr_review"
pr = "acme/api#42"
mins = 10

[expected]
min_f1 = 0.75
min_bucket_f1 = 0.75
min_resume_precision = 0.60
min_resume_recall = 0.60
