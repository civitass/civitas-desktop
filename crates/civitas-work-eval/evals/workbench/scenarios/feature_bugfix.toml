[meta]
name        = "feature_bugfix"
description = "Fix a regression in the auth middleware (Bearer token with trailing newline)"
seed        = 2001

[task]
brief = """
The auth middleware incorrectly rejects requests whose Bearer token
contains a trailing newline (e.g. when copied from a terminal).
Steps to reproduce: run `cargo test auth::test_bearer_newline` — it fails.

Fix the middleware to trim the token before validation.
Add a regression test `auth::test_bearer_trailing_newline_accepted`.
Do not change the public API surface.
"""
repo_init           = "scripts/workbench/init_feature_bugfix.sh"
expected_artifacts  = [
    "src/middleware/auth.rs",
    "tests/auth_regression.rs",
]

[[rubric]]
id          = "bug_reproduced"
description = "Runs the failing test to confirm the bug before writing the fix."
automated   = false

[[rubric]]
id          = "fix_correct"
description = "`cargo test` passes after the fix, including the new regression test."
automated   = true

[[rubric]]
id          = "test_added"
description = "A regression test covering the trailing-newline case is present in tests/."
automated   = true

[[rubric]]
id          = "no_scope_creep"
description = "Diff touches only auth.rs and the test file."
automated   = false

[[rubric]]
id          = "taste_match"
description = "Implementation style is consistent with the existing codebase conventions."
automated   = false

[[decision_points]]
id              = "reproduce_first"
description     = "Does the run reproduce the bug (run the failing test) before writing the fix?"
expected_value  = "yes"

[[decision_points]]
id              = "add_regression_test"
description     = "Does the run add a regression test for the specific bug?"
expected_value  = "yes"

[[decision_points]]
id              = "trim_not_parse"
description     = "Does the fix trim the token (simple) rather than restructuring the parser (over-engineered)?"
expected_value  = "trim"
