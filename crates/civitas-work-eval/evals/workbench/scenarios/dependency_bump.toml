[meta]
name        = "dependency_bump"
description = "Upgrade serde from 1.0.196 to 1.0.210 across the workspace"
seed        = 2003

[task]
brief = """
The workspace uses serde 1.0.196, which has a reported deserialization
performance regression in derive macros.  Upgrade to 1.0.210.

Steps:
1. Update the version in Cargo.toml (workspace root).
2. Run `cargo check --workspace` to surface any breakage.
3. Fix any compilation errors from the bump (there is one known API
   change: `serde::de::Unexpected::Str` now takes `&str` instead of
   `String`).
4. Run `cargo test --workspace` to confirm nothing is broken.
5. Commit with message: "chore: bump serde to 1.0.210"

Do not change any logic unrelated to the serde upgrade.
"""
repo_init           = "scripts/workbench/init_dependency_bump.sh"
expected_artifacts  = [
    "Cargo.toml",
    "Cargo.lock",
]

[[rubric]]
id          = "version_updated"
description = "Cargo.toml workspace serde version is 1.0.210."
automated   = true

[[rubric]]
id          = "cargo_check_passes"
description = "`cargo check --workspace` exits 0 after the bump."
automated   = true

[[rubric]]
id          = "tests_pass"
description = "`cargo test --workspace` exits 0 after the bump."
automated   = true

[[rubric]]
id          = "no_unrelated_changes"
description = "Diff contains only Cargo.toml, Cargo.lock, and the one API fix."
automated   = false

[[rubric]]
id          = "commit_message"
description = "Commit message follows the conventional commit format."
automated   = false

[[decision_points]]
id              = "check_before_fix"
description     = "Does the run run `cargo check` before attempting fixes?"
expected_value  = "yes"

[[decision_points]]
id              = "minimal_fix"
description     = "Does the run fix only the known API change (Unexpected::Str) and not refactor adjacent code?"
expected_value  = "yes"

[[decision_points]]
id              = "test_after_fix"
description     = "Does the run run `cargo test` after applying the fix to confirm nothing broke?"
expected_value  = "yes"
