[meta]
name        = "small_feature"
description = "Add per-route rate-limiting to the API middleware stack"
seed        = 2002

[task]
brief = """
Add configurable per-route rate limiting to the HTTP middleware stack.
The feature is tracked in issue #114.

Requirements:
- A `RateLimitConfig { requests_per_minute: u32, burst: u32 }` struct.
- A middleware layer that reads the config and returns HTTP 429 when
  the per-IP limit is exceeded.
- Unit tests for the happy path and the 429 path.
- Update `src/routes/mod.rs` to wire the new middleware.
- Do NOT add any new crate dependencies (use std only or existing deps).
"""
repo_init           = "scripts/workbench/init_small_feature.sh"
expected_artifacts  = [
    "src/middleware/rate_limit.rs",
    "src/routes/mod.rs",
    "tests/rate_limit.rs",
]

[[rubric]]
id          = "config_struct"
description = "RateLimitConfig struct is defined with the required fields."
automated   = false

[[rubric]]
id          = "middleware_returns_429"
description = "The middleware returns HTTP 429 when the rate limit is exceeded."
automated   = true

[[rubric]]
id          = "tests_pass"
description = "`cargo test` passes with the new middleware wired in."
automated   = true

[[rubric]]
id          = "no_new_deps"
description = "No new crate dependencies added to Cargo.toml."
automated   = true

[[rubric]]
id          = "taste_match"
description = "Middleware pattern matches the existing middleware style in the repo."
automated   = false

[[decision_points]]
id              = "sliding_window_vs_token_bucket"
description     = "Does the implementation use a sliding window (simple, correct) or token bucket?"
expected_value  = "sliding_window"

[[decision_points]]
id              = "per_ip_keying"
description     = "Is the rate limit keyed per IP address (not per route or global)?"
expected_value  = "yes"

[[decision_points]]
id              = "tests_before_wiring"
description     = "Are tests written before wiring the middleware into routes?"
expected_value  = "yes"
