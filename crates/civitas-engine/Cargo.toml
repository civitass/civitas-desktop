[package]
name = "civitas-engine"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
oasgen = { workspace = true }

civitas-events = { path = "../civitas-events" }
civitas-screen = { path = "../civitas-screen" }
civitas-audio = { path = "../civitas-audio" }
civitas-core = { path = "../civitas-core", features = ["security", "secrets"] }
civitas-db = { path = "../civitas-db" }
civitas-redact = { path = "../civitas-redact" }
civitas-a11y = { path = "../civitas-a11y", features = ["db"] }
civitas-capture = { path = "../civitas-capture" }
civitas-apple-intelligence = { path = "../civitas-apple-intelligence", optional = true }
civitas-config = { path = "../civitas-config" }
civitas-connect = { path = "../civitas-connect" }
civitas-vault = { path = "../civitas-vault" }
civitas-secrets = { path = "../civitas-secrets" }
civitas-mining = { path = "../civitas-mining" }
zeroize = { version = "1.8", features = ["derive"] }


# Image processing
image = { workspace = true }
imageproc = "0.25"

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Database
sqlx = { version = "0.8.6", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

anyhow = "1.0.86"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }

# Server
axum = { version = "0.7.5", features = ["ws", "multipart"] }
http-body-util = "0.1"
tokio = { version = "1.15", features = ["full", "tracing"] }
tokio-stream = "0.1"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }

# Log
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
console-subscriber = { version = "0.4.1", optional = true }
# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive", "env"] }

# Memory watchdog
sysinfo = "0.29.0"

# Color
colored = "2.0"

# Plugins
futures = { version = "0.3.31", features = ["std"] }

# Directory management
dirs = "5.0"

# Password input (no-echo for vault CLI)
rpassword = "7.5.4"

# Client http
reqwest = { workspace = true }

# Amazon Bedrock's credential chain and SigV4 signing. Bedrock bearer API
# keys continue through the same provider adapter; access keys and named
# profiles must use the official SDK rather than a handwritten signer.
aws-config = { version = "=1.8.18", features = ["behavior-version-latest", "credentials-login"] }
aws-credential-types = "=1.2.14"
aws-sdk-bedrockruntime = { version = "=1.132.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-eventstream = "=0.60.20"
aws-smithy-http-client = "=1.1.12"
aws-smithy-runtime-api = "=1.12.3"
aws-smithy-types = "=1.4.9"
aws-types = "=1.3.16"

# Concurrency
crossbeam = { workspace = true }

# base64
base64 = "0.22.1"

uuid = { version = "1.5.0", features = ["v4"] }

# Used by /connections/browsers/:id/navigate to validate URLs up-front so
# clients get 400 (client error) on malformed input rather than 502 from
# the upstream eval transport.
url = "2"
percent-encoding = "2"

# Local device diagnostics
hostname = "0.4"

tempfile = "3.3.0"


# Bincode for serializing hot cache
bincode = "1.3.3"

# SHA256 for hashing
sha2 = "0.10.6"
# Fast random number generator
fastrand = "2.1.1"
port_check = "0.2.1"

regex = "1.10.0"

lru = "0.16.3"
tokio-util = { version = "0.7", features = ["io"] }

once_cell = { workspace = true }
dashmap = { workspace = true }
arc-swap = "1"

# Heap profiling (opt-in via --features heap-prof)
dhat = { version = "0.3", optional = true }

# jemalloc — aggressively returns freed pages to OS, reducing RSS bloat from fragmentation.
# Default allocator on macOS/Linux. Not used on Windows (unsupported).
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
env_logger = "0.10"
proptest = "=1.11.0"
tempfile = "3.3.0"
tokio-tungstenite = "0.24"
tower = { version = "0.4", features = ["util"] }

# Benches
criterion = { workspace = true }

[features]
# Signed CLI release workflows enable the production credential-vault identity.
# Source and ad-hoc optimized builds intentionally use a development namespace.
official-build = ["civitas-secrets/official-build"]
# redact-onnx-cpu is in defaults because civitas-engine.rs unconditionally
# imports `civitas_redact::adapters::onnx` for the async PII worker. Without
# it, `cargo {check,clippy,build} -p civitas-engine` (no --features) fails
# to compile. Mac/Win release builds layer redact-onnx-{coreml,directml} on top.
default = ["qwen3-asr", "parakeet", "redact-onnx-cpu"]
consumer = []
dev-evals = []
metal = ["civitas-audio/metal"]
heap-prof = ["dhat"]
cuda = ["civitas-audio/cuda"]
directml = ["civitas-audio/directml"]
vulkan = ["civitas-audio/vulkan"]
debug-console = ["console-subscriber"]
pulseaudio = ["civitas-audio/pulseaudio"]
apple-intelligence = ["dep:civitas-apple-intelligence"]
qwen3-asr = ["civitas-audio/qwen3-asr"]
parakeet = ["civitas-audio/parakeet"]
parakeet-mlx = ["civitas-audio/parakeet-mlx"]
# v45 phase 3 text-PII redactor via ONNX Runtime. CPU baseline for
# Linux + the foundation for the GPU EPs below. ~280 MB INT8 model
# downloaded on first run.
redact-onnx-cpu = ["civitas-redact/onnx-cpu"]
# Mac: CoreML EP on top of CPU baseline. Apple Silicon picks up Metal
# + Neural Engine. Stock-OS dependency — no separate install.
redact-onnx-coreml = ["civitas-redact/onnx-coreml"]
# Windows: DirectML EP on top of CPU baseline. Any DX12-capable GPU
# (NVIDIA, AMD, Intel iGPU). Stock-OS dependency — DirectML.dll ships
# in Windows 10+ since 2019. Distinct from the existing `directml`
# feature, which forwards to civitas-audio's whisper.cpp.
redact-onnx-directml = ["civitas-redact/onnx-directml"]

jemalloc = ["tikv-jemallocator"]

[[bin]]
name = "civitas"
path = "src/bin/civitas-engine.rs"

[[bench]]
name = "hot_frame_cache"
harness = false

[[bench]]
name = "alloc_counter"
harness = false


[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
socket2 = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre.git", rev = "8481f3f0dc7dd39bb5be80d9424bfac0cad3801a", features = ["ax", "ns", "av", "blocks"] }
tracing-oslog = { workspace = true }

[package.metadata.cargo-machete]
# civitas-redact is wired into the engine binary (image-PII
# reconciliation worker, civitas-engine.rs:1571).
ignored = []
