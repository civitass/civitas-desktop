[package]
name = "civitas-core"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
civitas-events = { path = "../civitas-events" }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "6.0.1"
log = "0.4.17"
anyhow = "1.0.86"
tokio = { workspace = true }

# Security
regex = { version = "1.10.6", features = ["std"], optional = true }
lazy_static = { version = "1.4.0", optional = true }

tracing = { workspace = true }


dirs = "5.0.0"
clap = { version = "4.5.20", features = ["derive"] }

# random
rand = "0.8.5"

uuid = { version = "1.0", features = ["v4"] }

reqwest = { workspace = true }
async-trait = "0.1"
civitas-secrets = { path = "../civitas-secrets", optional = true }
civitas-vault = { path = "../civitas-vault", optional = true }

once_cell = "1.19.0"

cron = "0.13.0"

serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[features]
default = ["security"]
# objc's msg_send! emits #[cfg(feature = "cargo-clippy")] gates internally;
# declaring the feature silences "unexpected cfg" warnings in macOS builds
# without changing behavior (it's never enabled at compile time).
cargo-clippy = []
security = ["dep:regex", "dep:lazy_static"]
secrets = ["dep:civitas-secrets", "dep:civitas-vault"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# accessibility-sys = "0.1.3"
accessibility-sys = { git = "https://github.com/eiz/accessibility.git", rev = "173e898d4a52ee0afe0224ecb458d324057856e7" }
# accessibility = "0.1.6"
accessibility = { git = "https://github.com/eiz/accessibility.git", rev = "173e898d4a52ee0afe0224ecb458d324057856e7" }
objc = "0.2.7"
objc-foundation = "0.1.1"

core-foundation = "0.10"
core-graphics = { version = "0.24.0", features = ["highsierra"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.16.1" }
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
