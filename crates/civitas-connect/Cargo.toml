[package]
name = "civitas-connect"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# libsqlite3-sys is pulled in for the `bundled` feature so workspace crates
# link against the same C SQLite. Not directly imported here — silence machete.
[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]

[dependencies]
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
civitas-core = { path = "../civitas-core" }
civitas-secrets = { path = "../civitas-secrets" }
civitas-vault = { path = "../civitas-vault" }
tracing = { workspace = true }
dirs = "6"
chrono = "0.4"
chrono-tz = "0.10"
icalendar = "0.17"
async-trait = "0.1"
uuid = { version = "1.5.0", features = ["v4"] }
thiserror = "1"
base64 = "0.22.1"
sha2 = "0.10.6"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[features]
default = []
specta = []

[target.'cfg(target_os = "macos")'.dependencies]
eventkit-rs = { git = "https://github.com/divanshu-go/eventkit-rs", rev = "9dd52787c8435d734ed443e2d5641f45b0177cae", default-features = false, features = ["events"] }
objc2 = "0.6"
objc2-event-kit = "0.3"
objc2-foundation = "0.3"
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "ApplicationModel_Appointments",
    "Foundation",
    "Foundation_Collections",
] }
chrono = "0.4"
