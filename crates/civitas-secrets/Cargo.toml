[package]
name = "civitas-secrets"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enabled only by protected, signed release workflows. Source, development,
# test, and ad-hoc optimized builds use an isolated credential-vault service.
official-build = []

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
