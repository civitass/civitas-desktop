name: Test CLI npm e2e

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - ".github/workflows/test-cli-npm-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "packages/cli/**"
      - ".github/workflows/test-cli-npm-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-e2e:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: "1.93.1"
          override: true
          cache: true
          target: aarch64-apple-darwin
          rustflags: ""

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"

      - name: Install native build dependencies
        run: |
          brew unlink pkg-config@0.29.2 || true
          brew install ffmpeg pkg-config
          brew link --overwrite pkg-config

      - name: Build civitas CLI binary
        run: cd packages/cli && bun run build

      - name: Run npm e2e tests
        run: cd packages/cli && bun run test

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-e2e-logs
          path: packages/cli/npm-e2e/.work/logs
          if-no-files-found: ignore
