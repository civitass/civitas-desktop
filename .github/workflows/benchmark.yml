name: Rust Benchmark

on:
  schedule:
    - cron: "0 8 * * *" # Daily at midnight PST (8 AM UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  apple_ocr_benchmark:
    name: Run Apple OCR benchmark
    runs-on: [self-hosted, macos-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          brew install ffmpeg || true  # may already be installed on self-hosted

      - name: Generate synthetic OCR benchmark fixture
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: Pillow==11.3.0
          python scripts/generate_ocr_fixtures.py \
            --output-dir "$RUNNER_TEMP/civitas-ocr-fixtures" \
            --latin-font "/System/Library/Fonts/Supplemental/Arial.ttf" \
            --cjk-font "/System/Library/Fonts/Supplemental/Arial Unicode.ttf"
          echo "CIVITAS_OCR_FIXTURE_EN=$RUNNER_TEMP/civitas-ocr-fixtures/english.png" >> "$GITHUB_ENV"

      - name: Run OCR benchmarks
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/crates/civitas-screen/lib:${{ env.DYLD_LIBRARY_PATH }}
        run: |
          cargo bench --bench ocr_benchmark -- --output-format bencher | tee -a ocr_output.txt

      - name: Upload OCR benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-ocr-benchmark-data
          path: ocr_output.txt

  tesseract_ocr_benchmark:
    name: Run Tesseract OCR benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libleptonica-dev libtesseract-dev tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-tra fonts-noto-cjk fonts-dejavu-core

      - name: Generate synthetic OCR benchmark fixture
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: Pillow==11.3.0
          python scripts/generate_ocr_fixtures.py \
            --output-dir "$RUNNER_TEMP/civitas-ocr-fixtures" \
            --latin-font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --cjk-font /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          echo "CIVITAS_OCR_FIXTURE_EN=$RUNNER_TEMP/civitas-ocr-fixtures/english.png" >> "$GITHUB_ENV"

      - name: Run Tesseract OCR benchmarks
        run: |
          cargo bench --bench ocr_benchmark -- --output-format bencher | tee -a ocr_output.txt

      - name: Upload OCR benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tesseract-ocr-benchmark-data
          path: ocr_output.txt

  windows_ocr_benchmark:
    name: Run Windows OCR benchmark
    runs-on: [self-hosted, windows-desktop-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Generate synthetic OCR benchmark fixture
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: Pillow==11.3.0
          $fixtureDir = Join-Path $env:RUNNER_TEMP "civitas-ocr-fixtures"
          python scripts/generate_ocr_fixtures.py `
            --output-dir $fixtureDir `
            --latin-font "C:\Windows\Fonts\arial.ttf" `
            --cjk-font "C:\Windows\Fonts\msyh.ttc"
          $englishFixture = Join-Path $fixtureDir "english.png"
          "CIVITAS_OCR_FIXTURE_EN=$englishFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows OCR benchmarks
        shell: pwsh
        run: cargo bench --bench ocr_benchmark -- --output-format bencher | Tee-Object -FilePath ocr_output.txt

      - name: Upload OCR benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-ocr-benchmark-data
          path: ocr_output.txt

  stt_benchmark:
    name: Run STT benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-tra libtesseract-dev libavformat-dev libavfilter-dev libavdevice-dev ffmpeg libasound2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Run STT benchmarks
        run: |
          cargo bench --bench stt_benchmark -- --output-format bencher | tee -a stt_output.txt

      - name: Upload STT benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stt-benchmark-data
          path: stt_output.txt

  analyze_benchmarks:
    needs:
      [
        apple_ocr_benchmark,
        tesseract_ocr_benchmark,
        windows_ocr_benchmark,
        stt_benchmark,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download Apple OCR benchmark data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apple-ocr-benchmark-data
          path: ./cache/ocr/apple

      - name: Download Tesseract OCR benchmark data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tesseract-ocr-benchmark-data
          path: ./cache/ocr/tesseract

      - name: Download Windows OCR benchmark data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-ocr-benchmark-data
          path: ./cache/ocr/windows

      - name: Download STT benchmark data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stt-benchmark-data
          path: ./cache/stt

      - name: List contents of cache directory
        run: ls -R ./cache

      - name: Combine platform OCR benchmark data
        run: |
          : > ./cache/ocr/ocr_output.txt
          for platform in apple tesseract windows; do
            test -s "./cache/ocr/$platform/ocr_output.txt"
            cat "./cache/ocr/$platform/ocr_output.txt" >> ./cache/ocr/ocr_output.txt
          done

      - name: Analyze OCR benchmarks
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: OCR Benchmarks
          tool: "cargo"
          output-file-path: ./cache/ocr/ocr_output.txt
          github-token: ${{ secrets.GH_PAGES_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: true

