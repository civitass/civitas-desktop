name: Test CLI npm (blank slate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-macos-arm64:
    runs-on: macos-latest  # Apple Silicon (M1)
    steps:
      - name: Verify blank slate
        run: |
          echo "--- system info ---"
          uname -a
          echo "--- no civitas installed ---"
          which civitas 2>/dev/null && echo "FAIL: civitas already in PATH" && exit 1 || echo "OK: not installed"
          echo "--- node/bun ---"
          node --version || true
          which bun || echo "no bun"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"

      - name: Test bunx civitas status
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          echo "--- running: bunx civitas@0.3.139 status ---"
          bunx civitas@0.3.139 status 2>&1 || true
          echo "--- exit code: $? ---"

      - name: Test bunx civitas --help
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx civitas@0.3.139 --help 2>&1

      - name: Test bunx civitas record (5s timeout)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          echo "--- running: bunx civitas record (expect permission error on CI) ---"
          timeout 15 bunx civitas@0.3.139 record 2>&1 || echo "--- exited (expected on CI due to screen recording permission) ---"

  test-macos-x64:
    runs-on: macos-13  # Intel
    steps:
      - name: Verify blank slate
        run: |
          uname -a
          which civitas 2>/dev/null && exit 1 || echo "OK: not installed"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"

      - name: Test bunx civitas status
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx civitas@0.3.139 status 2>&1 || true

      - name: Test bunx civitas --help
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx civitas@0.3.139 --help 2>&1

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Verify blank slate
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsArchitecture
          $found = (Get-Command civitas -ErrorAction SilentlyContinue)
          if ($found) { Write-Error "civitas already installed"; exit 1 }
          Write-Output "OK: not installed"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"

      - name: Test bunx civitas status
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.bun\bin;$env:PATH"
          bunx civitas@0.3.139 status 2>&1
          Write-Output "exit code: $LASTEXITCODE"

      - name: Test bunx civitas --help
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.bun\bin;$env:PATH"
          bunx civitas@0.3.139 --help 2>&1

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Verify blank slate
        run: |
          uname -a
          which civitas 2>/dev/null && exit 1 || echo "OK: not installed"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libpulse0 libasound2-dev ffmpeg

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"

      - name: Test bunx civitas status
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx civitas@0.3.139 status 2>&1 || true

      - name: Test bunx civitas --help
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx civitas@0.3.139 --help 2>&1
