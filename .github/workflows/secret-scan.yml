name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # TruffleHog v3.96.0, pinned to the multi-platform image digest.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577

jobs:
  trufflehog:
    name: Scan changed commits without credential verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Need full history so TruffleHog can scan the diff between
          # base and head (PRs) or the whole repo (push).
          fetch-depth: 0

      - name: Scan changed commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          scan_args=(
            git file:///repo
            --branch "$head_sha"
            --fail
            --fail-on-scan-errors
            --no-update
            --no-verification
            --results=unverified
            --github-actions
          )

          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            scan_args+=(--since-commit "$BASE_SHA")
          else
            echo "::notice::No reachable base commit; scanning the checked-out history."
          fi

          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m \
            --volume "$PWD:/repo:ro" \
            "$TRUFFLEHOG_IMAGE" \
            "${scan_args[@]}"
