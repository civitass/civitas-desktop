#
# Quick test for SSL.com EV code signing — no build, just sign a dummy exe.
name: Test Code Signing

on:
  workflow_dispatch:
    inputs:
      confirm_signing_test:
        description: "Use protected SSL.com credentials to sign a disposable test binary"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  test-signing:
    if: inputs.confirm_signing_test == true
    runs-on: windows-2022
    environment: consumer-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Create dummy exe
        shell: powershell
        run: |
          # Create a minimal valid PE exe to test signing
          $exePath = "$env:RUNNER_TEMP\test-signing.exe"
          # Copy notepad as a test exe
          Copy-Item "C:\Windows\System32\notepad.exe" $exePath
          Write-Host "Test exe: $exePath"

      - name: Sign with SSL.com EV certificate
        shell: powershell
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          $cstDest = "$env:RUNNER_TEMP\CodeSignTool"
          $archive = Join-Path $env:RUNNER_TEMP "CodeSignTool-v1.3.2-windows.zip"
          & .github/scripts/windows/download-verified.ps1 `
            -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip" `
            -Destination $archive `
            -Sha256 "4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b" `
            -ExpectedBytes 214673784
          Expand-Archive -Path $archive -DestinationPath "$cstDest" -Force

          $jarFile = Get-ChildItem $cstDest -Recurse -Filter "code_sign_tool*.jar" | Select-Object -First 1
          $javaFile = Get-ChildItem $cstDest -Recurse -Filter "java.exe" | Select-Object -First 1
          if (-not $jarFile -or -not $javaFile) {
            throw "Verified CodeSignTool archive is missing its JAR or Java runtime"
          }

          foreach ($requiredName in @(
            "ESIGNER_USERNAME",
            "ESIGNER_PASSWORD",
            "ESIGNER_TOTP_SECRET",
            "ESIGNER_CREDENTIAL_ID"
          )) {
            $requiredValue = [Environment]::GetEnvironmentVariable($requiredName)
            if ([string]::IsNullOrWhiteSpace($requiredValue)) {
              throw "Required signing credential is unavailable"
            }
          }

          $exePath = "$env:RUNNER_TEMP\test-signing.exe"
          $signedDir = Join-Path $cstDest "signed"
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null

          Push-Location $cstDest
          & $javaFile.FullName -jar $jarFile.FullName sign `
            "-username=$env:ESIGNER_USERNAME" `
            "-password=$env:ESIGNER_PASSWORD" `
            "-totp_secret=$env:ESIGNER_TOTP_SECRET" `
            "-credential_id=$env:ESIGNER_CREDENTIAL_ID" `
            "-input_file_path=$exePath" `
            "-output_dir_path=$signedDir"
          Pop-Location

          Write-Host "Exit code: $LASTEXITCODE"
          $signedExe = Join-Path $signedDir "test-signing.exe"
          if (Test-Path $signedExe) {
            $sig = Get-AuthenticodeSignature $signedExe
            if ($sig.Status -ne "Valid") {
              throw "Disposable signing test produced an invalid Authenticode signature"
            }
            Write-Host "Disposable signing test passed."
          } else {
            throw "Disposable signing test produced no output binary"
          }
