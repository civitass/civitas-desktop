  /connections/{id}/proxy/{path}:
    description: Credential-injecting proxy for a compiled consumer connection. The path parameter may contain slash-separated
      segments. Encoded query length is limited to 8 KiB. Only GET, POST, PUT, and PATCH exist; every other method returns
      405. The proxy permits at most four concurrent requests, uses a five-second connection timeout and a 15-second total
      timeout, pins validated DNS answers, and refuses redirects.
    x-civitas-reviewed-method-exclusions:
      connect: Rejected with 405 because the proxy allowlist contains only GET, POST, PUT, and PATCH.
      delete: Rejected with 405 because destructive provider operations are not exposed by the generic proxy.
      options: Rejected with 405 by the proxy handler; CORS preflight is handled before routing when applicable.
      head: Rejected with 405 because the proxy allowlist contains only GET, POST, PUT, and PATCH.
      trace: Rejected with 405 because the proxy allowlist contains only GET, POST, PUT, and PATCH.
    x-civitas-handler-method-allowlist:
    - GET
    - POST
    - PUT
    - PATCH
    parameters:
    - in: path
      name: id
      required: true
      schema:
        enum:
        - airtable
        - clickup
        - fireflies
        - granola
        - limitless
        - linear
        - mochi
        - otter
        - perplexity
        - pocket
        - readwise
        - todoist
        - toggl
        - workflowy
        type: string
      style: simple
    - description: Relative upstream API path, including any slash-separated segments; limited to 2,048 UTF-8 bytes.
      in: path
      name: path
      required: true
      schema:
        type: string
        x-maxBytes: 2048
      style: simple
      x-greedy-path: true
    - description: Optional named local connection instance. This parameter is consumed locally and is not forwarded.
      in: query
      name: instance
      schema:
        type: string
      style: form
    - description: Optional retry key containing 8–128 ASCII letters, digits, dot, underscore, colon, or hyphen.
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 128
        minLength: 8
        pattern: ^[A-Za-z0-9_.:-]+$
        type: string
    - description: Optional upstream content negotiation value. It is forwarded only when it contains at most 256 non-control bytes; otherwise the proxy proceeds without it.
      in: header
      name: Accept
      required: false
      schema:
        type: string
        x-forwarded-maxBytes: 256
    get:
      description: Forwards a bodyless GET after connection, credential, destination, DNS, and size validation.
      operationId: connections_proxy_get
      responses:
        2XX:
          content:
            '*/*':
              schema: {}
          description: Successful upstream status and bounded body, with upstream Content-Type preserved.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid path, query, idempotency key, body, base URL, or destination.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authentication or the caller's exact connection-route permission failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Required connection credential is absent.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Connection ID has no compiled proxy configuration.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Four proxy requests are active, or local API concurrency is occupied.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Transport, trust configuration, or bounded-response processing failed.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Sanitized rejection carrying the upstream HTTP status without its response body.
      summary: Proxy a connection GET
      tags:
      - Connections
    patch:
      description: Forwards a PATCH body of at most 1 MiB after connection, credential, destination, DNS, and size validation.
      operationId: connections_proxy_patch
      requestBody:
        content:
          '*/*':
            schema:
